# Profile "local": the application runs on the host (IDE or .\mvnw spring-boot:run),
# PostgreSQL and Redis are reachable on localhost. Environment variables override every default.
# Credentials (DB_USERNAME, DB_PASSWORD) have no defaults and are never stored in this file.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:user_service_db}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
app:
  security:
    # The internal address of the Authentication Service, which runs on the host.
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
