# Profile "docker": the application runs in a container, PostgreSQL and Redis are reached by
# the service names of the Compose network. Environment variables override every default.
# Credentials (DB_USERNAME, DB_PASSWORD) have no defaults and are never stored in this file.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:user_service_db}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
