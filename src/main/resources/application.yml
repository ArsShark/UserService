spring:
  application:
    name: user-service
  profiles:
    # Used when no profile is set (IDE, .\mvnw spring-boot:run). Docker sets SPRING_PROFILES_ACTIVE=docker.
    default: local
  cache:
    type: redis
  datasource:
    # The URL, the Redis host and the Redis port are defined per profile:
    # application-local.yml and application-docker.yml.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      timeout: 500ms
      connect-timeout: 2s
      repositories:
        enabled: false
    web:
      pageable:
        max-page-size: 100
app:
  cache:
    users-ttl: ${CACHE_USERS_TTL:10m}
server:
  port: ${SERVER_PORT:8082}
logging:
  level:
    org.hibernate.orm.jdbc.error: ERROR
