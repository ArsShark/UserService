spring:
  application:
    name: user-service
  cache:
    type: redis
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:user_service_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 2s
      repositories:
        enabled: false
    web:
      pageable:
        max-page-size: 100
app:
  cache:
    users-ttl: ${CACHE_USERS_TTL:10m}
server:
  port: ${SERVER_PORT:8082}
logging:
  level:
    org.hibernate.orm.jdbc.error: ERROR
